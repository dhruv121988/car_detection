# Render deployment configuration
services:
  - type: web
    name: car-damage-detection
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_PATH
        value: runs/detect/train3/weights/best.pt
